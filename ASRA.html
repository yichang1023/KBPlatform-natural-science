@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
:root{--q:#3b8df0;--e:#f2b01e;--i:#27b97a;--c:#ef5b5b;--r:#9a6cf0;--ink:#16315a;--sub:#4b6a97}

        <p class="say mt-2">ASRA 的意思是「用分析幫忙我們<b>反思</b>」。論壇會把你說過的話、同學回應你的話,整理成圖和清單,當作<b>證據</b>。你看著證據想一想:<b>我的想法走到哪裡了?還缺什麼?下一步我要做什麼?</b>然後再去做、再回來檢查,一輪一輪越來越好。</p>

<script>
/* ============ 畫面 ============ */
(function () {
  var STEPS = [
    { zh: '看看走過的路', en: 'Monitoring', k: 'mon' },
    { zh: '量量走多遠', en: 'Evaluation', k: 'eval' },
    { zh: '用證據想一想', en: 'Reflection', k: 'refl' },
    { zh: '決定下一步', en: 'Self-regulation', k: 'plan' },
    { zh: '回頭再檢查', en: 'Iteration', k: 'iter' }
  ];
  var ACTS = {
    evidence: { big: '補證據', icon: 'fa-magnifying-glass', tip: '去查資料、做實驗、量一量、看一看,把看到的結果記下來。', ph: '例如:我要用溫度計量三次,把數字寫下來。' },
    revise: { big: '改想法', icon: 'fa-pen-to-square', tip: '把原本的想法改得更清楚、更正確,或寫出新的結論。', ph: '例如:我要把「影子會變短」改成「太陽越高,影子越短」。' },
    team: { big: '找夥伴', icon: 'fa-people-group', tip: '邀請同學一起想,或去回應一位還沒回應你的同學。', ph: '例如:我要問 S05 的看法,再回應他的想法。' }
  };
  var user = null, uid = null, readonly = false, data = null, nodes = [], topics = [], names = {};
  var cur = 0, selIdea = null, showAll = false;

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nameOf(id) { return names[id] || '同學'; }
  function cut(s, n) { s = String(s || '').replace(/\s+/g, ' '); return s.length > n ? s.slice(0, n) + '…' : s; }

  /* ---- 這位學生的反思與計畫:每次存檔都「新增一筆有日期的紀錄」,不覆蓋舊的(見 kb-asra.js) ---- */
  var S = { notes: {}, refl: [], plans: [], seen: {} };
  function reload() { S = KBAsra.derive(uid); }
  function ideaSnap(id) {
    var i = isLocalId(id) ? null : ideaById(id);
    if (i) return { ideaTitle: i.title, ideaStatus: i.status, topic: i.topic, topicId: i.topicId, srcType: 'forum' };
    var c = cardOf(id); if (!c) return {};
    var v = curView(), o = { ideaTitle: c.title, topic: c.sub || '', srcType: c.src, srcRef: id, unit: c.unit };
    if (c.src === 'ws') { o.timeMode = v.mode; o.asOf = v.asOf; if (v.mode === 'compare') { o.cmpA = v.a; o.cmpB = v.b; o.cmpPairs = v.pairs; } }
    return o;
  }
  function add(e) { var x = KBAsra.append(uid, e); reload(); return x; }

  /* ================= 多來源想法:論壇 / 學習單 / 自己新增 =================
   * ASRA 不再要求「先有論壇貼文」,而是「先有一個可以被反思的想法」。
   * 想法的三種來源:論壇貼文(原本的做法)、學習單(匯入資料包,見 kb-asra-src.js)、學生自己新增。
   * 學習單的回答依「時間方式」顯示:回到當時 / 回顧全部 / 前後對照。 */
  var SRC = { filter: 'all', unit: 'stage', mode: 'all', asOf: null, a: null, b: null, pairs: null, openMan: false, importMsg: '', pref: '' };
  function famOf(id) { id = String(id || ''); return /^ws:/.test(id) ? 'ws' : /^manual:/.test(id) ? 'manual' : 'forum'; }
  function wsOn() { return !!(window.KBSrc && KBSrc.has(uid)); }
  function viewKey() { return 'kb_asra_view_' + uid; }
  function initSrc() {
    SRC.filter = 'all'; SRC.unit = 'stage'; SRC.mode = 'all'; SRC.asOf = null; SRC.a = null; SRC.b = null; SRC.pairs = null; SRC.openMan = false; SRC.importMsg = '';
    try { var o = JSON.parse(localStorage.getItem(viewKey()) || 'null'); if (o) ['filter', 'unit', 'mode', 'asOf', 'a', 'b', 'pairs'].forEach(function (k) { if (o[k] !== undefined) SRC[k] = o[k]; }); } catch (e) {}
  }
  function saveView() { try { localStorage.setItem(viewKey(), JSON.stringify({ filter: SRC.filter, unit: SRC.unit, mode: SRC.mode, asOf: SRC.asOf, a: SRC.a, b: SRC.b, pairs: SRC.pairs })); } catch (e) {} }
  function curView() {
    var on = wsOn(), lat = on ? KBSrc.latestOrd(uid) : 0, ds = on ? KBSrc.stagesWithData(uid) : [0];
    var asOf = (SRC.asOf == null || SRC.asOf > lat || SRC.asOf < 0) ? lat : SRC.asOf;
    var a = (SRC.a == null || ds.indexOf(SRC.a) < 0) ? ds[0] : SRC.a, b = (SRC.b == null || ds.indexOf(SRC.b) < 0) ? ds[ds.length - 1] : SRC.b;
    if (a > b) { var t = a; a = b; b = t; }
    // 前後對照:最多 6 組(沒選過就用建議的六組);每組「之前」排左邊、「之後」排右邊
    var raw = (SRC.pairs && SRC.pairs.length) ? SRC.pairs : (on ? KBSrc.defaultPairs(ds) : [[a, b]]), pairs = [];
    raw.slice(0, 6).forEach(function (p) {
      var x = ds.indexOf(p[0]) < 0 ? ds[0] : p[0], y = ds.indexOf(p[1]) < 0 ? ds[ds.length - 1] : p[1]; if (x > y) { var t2 = x; x = y; y = t2; } pairs.push([x, y]);
    });
    if (!pairs.length) pairs = [[a, b]];
    if (SRC.mode === 'compare') { a = pairs[0][0]; b = pairs[0][1]; }
    return { mode: SRC.mode, asOf: asOf, a: a, b: b, pairs: pairs };
  }
  function isLocalId(id) { return /^(ws:|manual:)/.test(String(id || '')); }
  function manCards() { return window.KBSrc ? KBSrc.manualCards(S.ideas || [], uid) : []; }
  function wsCards() { return wsOn() ? KBSrc.cards(uid, SRC.unit) : []; }
  function cmpCard(unit) {
    var recs = KBSrc.records(uid); if (unit === 'task') recs = recs.filter(function (r) { return r.cat === 'idea'; });
    return { id: 'ws:cmp:' + unit, src: 'ws', unit: unit, ord: 0, title: '前後對照:' + (unit === 'task' ? '我的階段成果' : '我所有的回答'), sub: '選兩個階段,並排比較', records: recs, group: KBSrc.groupOf(uid), cmp: true };
  }
  function cardOf(id) {
    id = String(id || '');
    if (id.indexOf('manual:') === 0) return manCards().filter(function (c) { return c.id === id; })[0] || null;
    if (id.indexOf('ws:cmp:') === 0) return wsOn() ? cmpCard(id.split(':')[2]) : null;
    if (id.indexOf('ws:') === 0) return wsOn() ? KBSrc.cardById(uid, id) : null;
    return null;
  }
  // 目前可以選來反思的想法(依來源篩選與時間方式)
  function candidates() {
    var f = SRC.filter, v = curView(), out = { forum: [], ws: [], manual: [] };
    if (f === 'all' || f === 'forum') out.forum = data.ideas.slice().sort(function (a, b) { return (b.date || 0) - (a.date || 0); });
    if (wsOn() && (f === 'all' || f === 'ws')) {
      if (v.mode === 'compare' && SRC.unit !== 'thread') out.ws = [cmpCard(SRC.unit)];
      else out.ws = wsCards().filter(function (c) { return KBSrc.visibleCard(c, v); }).sort(function (a, b) { return b.ord - a.ord; });
    }
    if (f === 'all' || f === 'manual') out.manual = manCards().filter(function (c) { return KBSrc.visibleCard(c, v); }).sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
    return out;
  }
  function ensureSel(cand) {
    var ids = cand.forum.concat(cand.ws, cand.manual).map(function (x) { return x.id; });
    if (selIdea && ids.indexOf(selIdea) >= 0) return selIdea;
    // 原本選的想法看不到了(換了單位或時間方式):盡量留在同一種來源,不要突然跳到別種來源
    var fam = /^ws:/.test(String(selIdea || '')) ? cand.ws : /^manual:/.test(String(selIdea || '')) ? cand.manual : null;
    if (fam && fam.length) return fam[0].id;
    var order = SRC.pref === 'ws' ? [cand.ws, cand.forum, cand.manual] : SRC.pref === 'manual' ? [cand.manual, cand.forum, cand.ws] : [cand.forum, cand.ws, cand.manual];
    for (var k = 0; k < order.length; k++) if (order[k].length) return order[k][0].id;
    return null;
  }
  function optHtml(id, label, sel) { return '<option value="' + esc(id) + '"' + (id === sel ? ' selected' : '') + '>' + esc(label) + '</option>'; }
  function ideaOptions(sel, cand) {
    var fo = cand.forum.map(function (x) { return optHtml(x.id, ASRA.mmdd(x.date) + ' ' + ASRA.TNAME[x.type] + ':' + cut(x.title, 20), sel); }).join('');
    var ws = cand.ws.map(function (c) { return optHtml(c.id, c.title, sel); }).join('');
    var ma = cand.manual.map(function (c) { return optHtml(c.id, c.title, sel); }).join('');
    var n = (fo ? 1 : 0) + (ws ? 1 : 0) + (ma ? 1 : 0);
    if (n <= 1) return fo || ws || ma;
    return (fo ? '<optgroup label="論壇的想法">' + fo + '</optgroup>' : '') + (ws ? '<optgroup label="學習單的想法">' + ws + '</optgroup>' : '') + (ma ? '<optgroup label="我自己新增的想法">' + ma + '</optgroup>' : '');
  }
  function totalIdeas() { return data.ideas.length + (wsOn() ? wsCards().length : 0) + (S.ideas || []).length; }
