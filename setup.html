<style>
  html, body { height: 100%; }
  body { margin: 0; font-family: 'Noto Sans TC', sans-serif; background: #f1f5f9; color: #0f172a; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 18px 20px; box-shadow: 0 1px 3px rgba(15,23,42,.05); }
  .nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 14px; border-radius: 10px; color: #94a3b8; font-size: .9rem; transition: all .15s; border-left: 3px solid transparent; }
  .nav-btn:hover { background: rgba(255,255,255,.06); color: #e2e8f0; }
  .nav-btn.active { background: rgba(99,102,241,.18); color: #fff; border-left-color: #818cf8; }
  .nav-btn i { width: 18px; text-align: center; }
  .tbl { width: 100%; border-collapse: collapse; font-size: .85rem; }
  .tbl th { background: #f8fafc; text-align: left; padding: 8px 10px; font-weight: 700; color: #475569; border-bottom: 1px solid #e2e8f0; white-space: nowrap; position: sticky; top: 0; }
  .tbl td { padding: 8px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
  .tbl tr:hover td { background: #fafaff; }
  .chip { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: .7rem; font-weight: 800; color: #fff; }
  .chip.master { background: #7c3aed; } .chip.teacher { background: #2563eb; } .chip.student { background: #16a34a; }
  .chip.ok { background: #dcfce7; color: #166534; } .chip.warn { background: #fef3c7; color: #92400e; } .chip.bad { background: #fee2e2; color: #991b1b; } .chip.gray { background: #e2e8f0; color: #475569; }
  .btn { border: 0; border-radius: 9px; padding: 7px 13px; font-weight: 700; font-size: .82rem; cursor: pointer; transition: transform .1s, opacity .15s; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; }
  .btn:active { transform: scale(.97); } .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-p { background: linear-gradient(135deg,#4f46e5,#2563eb); color: #fff; } .btn-g { background: #f1f5f9; color: #334155; } .btn-d { background: #dc2626; color: #fff; } .btn-s { background: #16a34a; color: #fff; }
  .btn-sm { padding: 4px 9px; font-size: .75rem; }
  .inp { border: 1.5px solid #cbd5e1; border-radius: 9px; padding: 7px 10px; font-size: .85rem; outline: none; background: #fff; font-family: inherit; }
  .inp:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
  .lbl { display: block; font-size: .75rem; font-weight: 700; color: #475569; margin: 10px 0 4px; }
  .sw { position: relative; width: 42px; height: 24px; background: #cbd5e1; border-radius: 999px; cursor: pointer; transition: background .15s; flex-shrink: 0; }
  .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .sw.on { background: #4f46e5; } .sw.on::after { transform: translateX(18px); }
  .row-set { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px dashed #e2e8f0; }
  .row-set:last-child { border-bottom: 0; }
  .danger-zone { border: 1.5px solid #fecaca; background: #fff7f7; border-radius: 14px; padding: 16px 20px; }
  .stat { background: linear-gradient(135deg,#fff,#f8fafc); }
  .fade-in { animation: fadein .25s ease-out; } @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .drop { border: 2px dashed #a5b4fc; border-radius: 12px; padding: 22px; text-align: center; background: #eef2ff; color: #4338ca; cursor: pointer; }
  .drop.over { background: #e0e7ff; border-color: #4f46e5; }
  @media print { .no-print { display: none !important; } .print-card { break-inside: avoid; } }

<body>
<div class="flex h-full">
  <!-- 側邊導覽 -->

<script>
(function () {
  var gate = KBUI.requireLogin({ staff: true });
  if (!gate) return;
  KBUI.mountUserBar();
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = KBUI.esc;
  var ROLE_TXT = { master: '管理者', teacher: '老師', student: '學生' };
  var TYPE_TXT = { question: '提問', extend: '延伸', improve: '改進', counter: '反例', riseabove: '整合' };
  var CATS = ['科學', 'STEAM', '專題課', '電機電子', 'AI', '語言學習', '文學', '社會議題', '物理', '動漫', '程式', '歷史', '哲學', '藝術', '其他'];

  /* ================= 共用工具 ================= */
  function fmt(t) { if (!t) return '—'; var d = new Date(t); return isNaN(d) ? '—' : d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function dateStr() { var d = new Date(); return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0'); }
  function download(name, content, mime) {
    var binary = typeof content !== 'string';
    var blob = new Blob([content], { type: binary ? (mime || 'application/octet-stream') : (mime || 'text/plain') + ';charset=utf-8' });
    // 舊版 Edge/IE 的儲存方式
    if (navigator.msSaveOrOpenBlob) { navigator.msSaveOrOpenBlob(blob, name); return; }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = name; a.style.display = 'none'; document.body.appendChild(a); a.click();
    // 太早收回網址會讓瀏覽器「儲存失敗」,所以延後一分鐘才釋放
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 60000);
  }
  function sw(id, on) { return '<div class="sw' + (on ? ' on' : '') + '" role="switch" aria-checked="' + (on ? 'true' : 'false') + '" tabindex="0" data-sw="' + id + '"></div>'; }
  function setRow(title, desc, ctrl) { return '<div class="row-set"><div><div class="font-bold text-sm">' + title + '</div><div class="text-xs text-slate-500 mt-0.5">' + (desc || '') + '</div></div><div class="shrink-0">' + ctrl + '</div></div>'; }
  function card(title, icon, body, extra) { return '<div class="card fade-in"><div class="flex items-center gap-2 mb-3"><i class="fa-solid ' + icon + ' text-indigo-500"></i><h2 class="font-bold">' + title + '</h2><div class="ml-auto flex gap-2 flex-wrap">' + (extra || '') + '</div></div>' + body + '</div>'; }
  function pwHidden() { try { return localStorage.getItem('kb_setup_pw_hide') === '1'; } catch (e) { return false; } }
  function ok(r, msg) { if (r && r.ok === false) { KBUI.toast(r.error || '操作失敗', 'err'); return false; } if (msg) KBUI.toast(msg, 'ok'); return true; }
  function clsName(id) { var c = KB.classes.list().filter(function (x) { return x.id === id; })[0]; return c ? c.name : ''; }
  function grpName(id) { var g = KB.classes.groups().filter(function (x) { return x.id === id; })[0]; return g ? g.name : ''; }
  function opts(list, sel, blank) { return (blank !== undefined ? '<option value="">' + esc(blank) + '</option>' : '') + list.map(function (o) { return '<option value="' + esc(o.v) + '"' + (String(o.v) === String(sel) ? ' selected' : '') + '>' + esc(o.t) + '</option>'; }).join(''); }

  /* ================= 導覽 ================= */
  var SECTIONS = [
    { id: 'overview', icon: 'fa-gauge-high', title: '總覽', sub: '平台狀態、安全檢查與快速動作' },
    { id: 'users', icon: 'fa-users-gear', title: '使用者管理', sub: '帳號、角色、密碼、匯入 Excel / CSV' },
    { id: 'classes', icon: 'fa-people-group', title: '班級與分組', sub: '建立班級、組別,並把學生分配進去' },
    { id: 'forum', icon: 'fa-comments', title: '論壇設定', sub: '討論區管理與學生權限、發文規則' },
    { id: 'analysis', icon: 'fa-chart-pie', title: '分析設定', sub: 'KB 12 原則與認知能動性的判斷門檻' },
    { id: 'ai', icon: 'fa-robot', title: 'AI 設定', sub: 'Gemini 金鑰、AI 功能開關與模型' },
    { id: 'data', icon: 'fa-database', title: '資料與備份', sub: '匯出、備份、還原、回收桶與危險操作' },
    { id: 'appearance', icon: 'fa-palette', title: '平台與安全設定', sub: '平台名稱、公告、維護模式、登入安全、顯示方式' },
    { id: 'audit', icon: 'fa-clipboard-list', title: '稽核紀錄', sub: '誰在什麼時間做了什麼' },
    { id: 'account', icon: 'fa-id-badge', title: '我的帳號', sub: '修改密碼與登出' }
  ];
  var current = (location.hash || '#overview').slice(1);
  if (!SECTIONS.some(function (s) { return s.id === current; })) current = 'overview';
  function navHTML(mobile) { return SECTIONS.map(function (s) { return '<button class="nav-btn' + (s.id === current ? ' active' : '') + '" data-go="' + s.id + '" data-kbhref="setup.html#' + s.id + '"><i class="fa-solid ' + s.icon + '"></i>' + esc(s.title) + '</button>'; }).join(''); }
  function renderNav() {
    $('#nav').innerHTML = navHTML();
    $('#mobile-nav').innerHTML = navHTML();
    var ql = KBUI.navItems().filter(function (i) { return i.href !== 'setup.html'; });
    $('#quick-links').innerHTML = '<div class="text-[11px] text-slate-500 px-3 pb-1">快速前往</div>' + ql.map(function (i) { return '<a class="nav-btn" href="' + esc(i.href) + '"><i class="fa-solid ' + i.icon + '"></i>' + esc(i.text) + '</a>'; }).join('');
    $('#top-links').innerHTML = ql.map(function (i) { return '<a class="bg-white/15 hover:bg-white/25 px-3 py-1.5 rounded-lg font-bold flex items-center gap-1.5" href="' + esc(i.href) + '"><i class="fa-solid ' + i.icon + '"></i>' + esc(i.text) + '</a>'; }).join('');
    var s = SECTIONS.filter(function (x) { return x.id === current; })[0];
    $('#page-title').textContent = s.title; $('#page-sub').textContent = s.sub;
    $('#brand-name').textContent = KB.settings.get().platformName || '設定中心';
    document.title = s.title + ' | 設定中心';
  }
  function go(id) { current = id; location.hash = id; renderNav(); render(); $('#main').scrollTop = 0; $('#mobile-nav').classList.add('hidden'); }
  function render() { var f = R[current]; if (f) { try { f(); } catch (e) { console.error(e); $('#content').innerHTML = '<div class="card text-red-600">此區塊載入失敗:' + esc(e.message) + '</div>'; } } }

  /* ================= 1 總覽 ================= */
  var R = {};
  R.overview = function () {
    var st = KB.stats(), cfg = KB.settings.get(), bk = KB.backup.list();
    function stat(icon, color, n, label) { return '<div class="card stat flex items-center gap-3"><div class="w-11 h-11 rounded-xl flex items-center justify-center text-lg text-white ' + color + '"><i class="fa-solid ' + icon + '"></i></div><div><div class="text-2xl font-extrabold leading-none">' + n + '</div><div class="text-xs text-slate-500 mt-1">' + label + '</div></div></div>'; }
    var checks = [];
    function chk(level, title, desc, action) { checks.push('<div class="flex items-start gap-3 py-2.5 border-b border-slate-100 last:border-0"><span class="chip ' + level + ' mt-0.5">' + ({ ok: '正常', warn: '注意', bad: '待處理' }[level]) + '</span><div class="flex-1"><div class="text-sm font-bold">' + title + '</div><div class="text-xs text-slate-500">' + desc + '</div></div>' + (action || '') + '</div>'); }
    if (st.defaultStaffPw.length) chk('bad', '仍在使用預設密碼', '帳號 <b>' + st.defaultStaffPw.map(esc).join('、') + '</b> 的密碼與帳號相同,正式使用前請務必更換。', '<button class="btn btn-p btn-sm" data-go="users">前往更換</button>');
    else chk('ok', '最高權限帳號未使用預設密碼', '');
    chk(st.staff >= 2 ? 'ok' : 'warn', '最高權限帳號數量:' + st.staff, st.staff >= 2 ? '建議保留至少兩個,避免唯一帳號忘記密碼。' : '目前只有一個,建議再建立一個備援帳號。', st.staff >= 2 ? '' : '<button class="btn btn-g btn-sm" data-go="users">新增帳號</button>');
    chk('ok', '仍使用預設密碼(=學號)的學生:' + st.mustChange + ' 人', '目前統一不強制學生改密碼,登入後可直接使用。');
    chk(bk.length ? 'ok' : 'warn', bk.length ? '最近備份:' + fmt(bk[bk.length - 1].time) : '尚未建立任何備份', '建議在重要操作前建立備份;清空、還原前系統也會自動備份。', '<button class="btn btn-g btn-sm" data-act="quick-backup">立即備份</button>');
    chk(cfg.maintenance ? 'warn' : 'ok', '維護模式:' + (cfg.maintenance ? '已開啟(學生與訪客無法進入)' : '關閉'), '');
    chk(cfg.forumLocked ? 'warn' : 'ok', '論壇鎖定:' + (cfg.forumLocked ? '已鎖定(學生不能發文)' : '未鎖定'), '');
    chk('ok', '訪客瀏覽:' + (cfg.guestEnabled ? '開放(只能看論壇)' : '關閉'), '');
    var pct = Math.round(st.storageBytes / (5 * 1024 * 1024) * 100);
    chk(pct > 70 ? 'bad' : (pct > 40 ? 'warn' : 'ok'), '本機儲存空間:約 ' + (st.storageBytes / 1024).toFixed(0) + ' KB(約 ' + pct + '% 的 5MB 上限)', pct > 40 ? '資料量較大,請匯出備份後清理舊備份。' : '');
    var au = KB.audit.list({ limit: 6 });
    $('#content').innerHTML =
      '<div class="grid grid-cols-2 lg:grid-cols-4 gap-4">' + stat('fa-user-graduate', 'bg-emerald-500', st.students, '學生') + stat('fa-user-shield', 'bg-violet-500', st.staff, '老師 / 管理者') + stat('fa-people-group', 'bg-sky-500', st.classes + ' / ' + st.groups, '班級 / 組別') + stat('fa-comments', 'bg-indigo-500', st.topics, '討論區') + stat('fa-message', 'bg-blue-500', st.posts, '貼文') + stat('fa-trash-can', 'bg-slate-500', st.trash, '回收桶') + stat('fa-key', 'bg-amber-500', st.mustChange, '待改密碼學生') + stat('fa-hard-drive', 'bg-teal-500', bk.length, '備份份數') + '</div>' +
      '<div class="grid lg:grid-cols-5 gap-5"><div class="lg:col-span-3">' + card('安全檢查', 'fa-shield-halved', checks.join('')) + '</div><div class="lg:col-span-2 space-y-5">' +
      card('快速動作', 'fa-bolt', '<div class="grid grid-cols-2 gap-2"><button class="btn btn-p justify-center" data-go="users"><i class="fa-solid fa-file-import"></i>匯入名單</button><button class="btn btn-g justify-center" data-go="classes"><i class="fa-solid fa-people-group"></i>班級分組</button><button class="btn btn-g justify-center" data-go="forum"><i class="fa-solid fa-comments"></i>論壇設定</button><button class="btn btn-g justify-center" data-act="quick-backup"><i class="fa-solid fa-floppy-disk"></i>立即備份</button><a class="btn btn-g justify-center" href="Knowledge Building Forum.html?home=1"><i class="fa-solid fa-comments"></i>開啟論壇</a><a class="btn btn-g justify-center" href="ANALYTICS-teacher.html"><i class="fa-solid fa-chart-line"></i>老師分析</a></div>') +
      card('最近操作', 'fa-clock-rotate-left', au.length ? au.map(function (a) { return '<div class="text-xs py-1.5 border-b border-slate-100 last:border-0"><span class="text-slate-400">' + fmt(a.t) + '</span> · <b>' + esc(a.actor) + '</b> ' + esc(a.action) + (a.ok === false ? ' <span class="chip bad">失敗</span>' : '') + '</div>'; }).join('') : '<div class="text-sm text-slate-400">尚無紀錄</div>', '<button class="btn btn-g btn-sm" data-go="audit">全部</button>') +
      '</div></div>';
  };

  /* ================= 2 使用者管理 ================= */
  var U = { q: '', role: '', cls: '', status: '', sel: {}, page: 1, per: 20 };
  /* 點學生的學號或姓名 → 另開新分頁,直接看這位學生的知識羅盤(學生分析) */
  function compassLink(u, inner) {
    if (u.role !== 'student') return inner;
    return '<a class="text-indigo-700 hover:underline hover:text-indigo-900" href="ANALYTICS-student.html?student=' + encodeURIComponent(u.id) + '" target="_blank" rel="noopener" title="在新分頁開啟 ' + esc(u.realName || u.id) + ' 的知識羅盤"><i class="fa-solid fa-compass text-[10px] mr-1 opacity-70"></i>' + inner + '</a>';
  }
  function placeholderNote() {
    var n = KB.users.list().filter(function (u) { return u.placeholder; }).length;
    if (!n) return '';
    return '<div class="card" style="border-color:#fde68a;background:#fffbeb"><div class="flex items-start gap-3"><i class="fa-solid fa-user-clock text-amber-600 mt-1"></i><div class="text-sm"><b class="text-amber-900">還有 ' + n + ' 位預建學生等待確認學號</b><div class="text-xs text-amber-800 mt-1 leading-relaxed">這些學生(編碼 S01、S02…)的貼文已經在平台上。請按「匯入名單」上傳含「學號、姓名、班級、初始密碼」的 Excel,系統會依<b>姓名</b>找到對應的人,把學號換成真實學號、保留所有貼文並啟用帳號。在那之前,他們無法登入。</div></div></div></div>';
  }
  function filteredUsers() {
    var q = U.q.trim().toLowerCase();
    return KB.users.list().filter(function (u) {
      if (U.role && u.role !== U.role) return false;
      if (U.cls && u.classId !== U.cls) return false;
      if (U.status && u.status !== U.status) return false;
      if (q && (u.id.toLowerCase().indexOf(q) < 0 && String(u.realName).toLowerCase().indexOf(q) < 0)) return false;
      return true;
    });
  }
  R.users = function () {
    var list = filteredUsers(), pages = Math.max(1, Math.ceil(list.length / U.per)); if (U.page > pages) U.page = pages;

    if (s) {
      var on = !s.classList.contains('on'), id = s.dataset.sw;
      if (id === 'maintenance' && on) { KBUI.confirm({ title: '開啟維護模式', html: '開啟後學生與訪客立刻無法使用平台。確定嗎?', okText: '開啟維護模式' }).then(function (y) { if (y) { SW[id](true); R[current](); } }); return; }
      s.classList.toggle('on', on); s.setAttribute('aria-checked', on ? 'true' : 'false'); SW[id] && SW[id](on); KBUI.toast('已更新', 'ok'); return;
    }
    var a = e.target.closest('[data-act]');
    if (a && A[a.dataset.act] && a.type !== 'checkbox') { A[a.dataset.act](a, e); return; }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'ai-model-sel') { KB.settings.update({ ai: { model: t.value } }); KBUI.toast(t.value === 'auto' ? '已改為自動選擇最新模型' : '已指定使用 ' + t.value, 'ok'); renderModelBox(); return; }
    if (t.dataset && t.dataset.setting) { var p = {}; p[t.dataset.setting] = t.value; KB.settings.update(p); KBUI.toast('已更新', 'ok'); return; }
    if (t.type === 'checkbox' && t.dataset && t.dataset.act && A[t.dataset.act]) { A[t.dataset.act](t); return; }
  });
  // 使用者勾選(用 data-sel 的 checkbox)
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches && t.matches('input[type=checkbox][data-sel]')) { if (t.checked) U.sel[t.dataset.sel] = 1; else delete U.sel[t.dataset.sel]; R.users(); }
  });
  document.addEventListener('keydown', function (e) { var s = e.target.closest && e.target.closest('[data-sw]'); if (s && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); s.click(); } });
  $('#menu-btn').onclick = function () { $('#mobile-nav').classList.toggle('hidden'); };
  window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (h && h !== current && SECTIONS.some(function (s) { return s.id === h; })) { current = h; renderNav(); render(); } });
  KB.on(function (keys, remote) { if (!remote) return; if (!KB.auth.current()) return; renderNav(); if (!document.querySelector('.kbui-overlay')) render(); });

  renderNav(); render(); KBUI.announce();
})();
</script>
